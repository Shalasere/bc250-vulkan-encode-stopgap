# bc250-vcn-driver v0.2.0 - https://github.com/Kai/bc250-vcn-driver
# Optimized Sunshine Configuration for AMD BC-250 APU
# Place in: ~/.config/sunshine/sunshine.conf or /etc/sunshine/sunshine.conf
#
# NOTE: this file only sets encoder/streaming keys. It intentionally does NOT
# set `capture`, `origin_web_ui_allowed`, or `csrf_allowed_origins` because
# those are host/network-specific — apply_sunshine_preset.sh overwrites the
# whole file, so applying this on a system with an already-working Sunshine
# config (e.g. one pinned to `capture = kms`) will silently drop those
# settings. Back up and re-merge them by hand if that applies to you.

# Hardware Encoder Configuration
encoder = vaapi
adapter_name = /dev/dri/renderD128

# Streaming Tuning
min_threads = 2
fec_percentage = 20

# Low-Latency Settings
hevc_mode = 0
audio_sink = auto
back_button_timeout = 2000

# The following keys were removed from this preset because they do not exist
# in Sunshine's config schema (verified against the installed `sunshine`
# binary's config-key strings table) and were silently ignored no-ops:
#   channels, qp, origin_pin_allowed, nvenc_preset (nvenc_* keys only apply
#   when encoder = nvenc, not vaapi)
